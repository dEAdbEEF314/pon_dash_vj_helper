<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Control | Pon Dash VJ Helper (仮)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/png" href="/pon_dash/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/pon_dash/favicon.svg" />
    <link rel="shortcut icon" href="/pon_dash/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pon_dash/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pon Dash VJ Helper (仮)" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Antique&display=swap" rel="stylesheet">
    <link rel="manifest" href="/pon_dash/site.webmanifest" />
</head>

<body class="app-page">
    <!-- ログイン画面 -->
    <div class="login-screen" id="loginScreen">
        <div class="glass-panel" style="max-width: 400px; width: 100%;">
            <h2>DJ Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>操作許可パスワード</label>
                    <input type="password" id="password" pattern="\d{4}" placeholder="数字4桁" required>
                </div>
                <button type="submit" class="btn btn-primary">ログイン</button>
                <div id="loginError" style="color: var(--danger-color); margin-top: 10px; display: none;">パスワードが違います
                </div>
            </form>
        </div>
    </div>

    <div class="container hidden" id="mainApp">
        <header class="dj-header">
            <div class="dj-header-main">
                <h1>DJ Control</h1>
                <button type="button" class="btn" id="deleteSessionBtn">このセッションを削除</button>
            </div>
            <p id="sessionNameDisplay"></p>
        </header>

        <!-- タブ切替バー -->
        <div class="tab-bar" id="djTabBar">
            <button type="button" class="tab-btn active" data-tab="dj">🎧 DJ操作</button>
            <button type="button" class="tab-btn" data-tab="vj-search">🔍 VJ検索</button>
        </div>

        <!-- タブ1: DJ操作 -->
        <div id="tab-dj" class="tab-content">
            <!-- 上段：ステータス表示 -->
            <div class="glass-panel panel-compact">
                <div class="panel-inner-stack">
                    <div class="track-info-box send-track" id="sendTrackBox">
                        <div class="label" id="sendTrackLabel">
                            VJにSENDした曲 (SENT to VJ)
                            <span id="vjReadyBadge" class="badge-ready" style="display:none;">[VJ READY]</span>
                        </div>
                        <div class="track-title" id="sendTitle">-</div>
                        <div class="track-artist" id="sendArtist">-</div>
                    </div>
                    <div class="track-info-box preview-track" id="sendPreviewBox">
                        <div class="label">VJにSENDする曲 (SEND to VJ)</div>
                        <div class="track-title" id="previewTitle">-</div>
                        <div class="track-artist" id="previewArtist">-</div>
                    </div>
                </div>
            </div>

            <!-- 中段：SENDボタンエリア -->
            <div class="glass-panel panel-compact send-section">
                <div class="send-btn-group">
                    <button class="btn btn-send" id="sendBtn">SEND TO VJ</button>
                    <button type="button" class="btn btn-vibes" id="openVibesModalBtn">VIBES!</button>
                </div>
                <p class="send-hint">※下段のリストから選択してSEND / 「VIBES!」で手入力SEND</p>
            </div>

            <!-- 下段：プレイリスト -->
            <div class="glass-panel playlist-section">
                <div class="section-header">
                    <h3>プレイリスト</h3>
                    <span class="header-hint">※タップして次にかける曲をセット</span>
                </div>
                <!-- リスト本体 (スクロール領域) -->
                <div class="playlist-container" id="playlistContainer">
                    <!-- JSで動的に追加 -->
                </div>
            </div>
        </div>

        <!-- タブ2: VJ検索 -->
        <div id="tab-vj-search" class="tab-content hidden">
            <div class="glass-panel panel-compact">
                <div class="panel-inner-stack">
                    <div class="track-info-box send-track" id="vjSearchSendTrackBox">
                        <div class="label">DJからSENDされた曲 (タップで検索窓にコピー)</div>
                        <div class="track-title copyable" id="vjSearchSendTitle" title="タップでコピー">-</div>
                        <div class="track-artist copyable" id="vjSearchSendArtist" title="タップでコピー">-</div>
                    </div>
                </div>
            </div>

            <div class="glass-panel search-section">
                <div class="section-header">
                    <h3>素材検索</h3>
                </div>
                <div class="search-input-group">
                    <input type="text" id="djVjSearchInput" placeholder="検索ワードを入力してください（曲名タップも可）">
                </div>
                <div class="search-links" id="djSearchLinksSend">
                    <button type="button" class="btn" data-search="google">Google</button>
                    <button type="button" class="btn" data-search="youtube">YouTube</button>
                    <button type="button" class="btn" data-search="niconico">ニコニコ動画</button>
                    <button type="button" class="btn" data-search="giphy">GIPHY</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 手入力 (VIBES!) モーダル -->
    <div class="vibes-modal-overlay" id="vibesModalOverlay">
        <div class="vibes-modal-content">
            <div class="vibes-modal-header">
                <h3>✏️ 手入力SEND (VIBES!)</h3>
                <button type="button" class="vibes-modal-close" id="closeVibesModalBtn">&times;</button>
            </div>
            <div class="vibes-modal-body">
                <form id="vibesForm">
                    <div class="form-group">
                        <label for="vibesTitleInput">曲名 / メッセージ <span style="color:#ff007f;">*</span></label>
                        <input type="text" id="vibesTitleInput" placeholder="例: 新曲 / MCタイム" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="vibesArtistInput">アーティスト名 (任意)</label>
                        <input type="text" id="vibesArtistInput" placeholder="例: DJ Vibes" autocomplete="off">
                    </div>
                    <div class="vibes-presets">
                        <div class="vibes-presets-label">⚡ クイックプリセット</div>
                        <div class="vibes-presets-list">
                            <button type="button" class="vibes-preset-btn" data-title="🎤 MCタイム" data-artist="-">🎤
                                MC</button>
                            <button type="button" class="vibes-preset-btn" data-title="🔥 Vibes Track"
                                data-artist="Unreleased">🔥 Vibes Track</button>
                            <button type="button" class="vibes-preset-btn" data-title="⚠️ 機器トラブル調整中" data-artist="-">⚠️
                                調整中</button>
                            <button type="button" class="vibes-preset-btn" data-title="✨ SPECIAL GUEST"
                                data-artist="-">✨ GUEST</button>
                        </div>
                    </div>
                    <button type="submit" class="btn-vibes-send" id="sendVibesBtn">SEND TO VJ (VIBES!)</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Pusherライブラリ (M-4: 本番デプロイ時に integrity 属性を追加してください) -->
    <!-- SRIハッシュ生成: openssl dgst -sha384 -binary pusher.min.js | openssl base64 -A -->
    <script src="https://js.pusher.com/8.2.0/pusher.min.js" crossorigin="anonymous"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/dj.js"></script>
</body>

</html>
