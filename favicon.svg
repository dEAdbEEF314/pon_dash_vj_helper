<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pdvhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#ff3366"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00ffcc" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- 背景円 (ダークテーマ) -->
  <rect width="100" height="100" rx="22" fill="#121212"/>
  <rect width="96" height="96" x="2" y="2" rx="20" fill="#1a1a24" stroke="url(#pdvhGrad)" stroke-width="2"/>
  
  <!-- ヘッドフォンバンド -->
  <path d="M26,52 C26,35 36,22 50,22 C64,22 74,35 74,52" fill="none" stroke="url(#pdvhGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- イコライザーバー (中央) -->
  <line x1="42" y1="44" x2="42" y2="58" stroke="#00ffcc" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="36" x2="50" y2="66" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="58" y1="42" x2="58" y2="60" stroke="#ff3366" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- 左イヤーパッド -->
  <rect x="20" y="48" width="10" height="24" rx="5" fill="#00ffcc"/>
  <!-- 右イヤーパッド -->
  <rect x="70" y="48" width="10" height="24" rx="5" fill="#ff3366"/>
  
  <!-- 稲妻アクセント (Vibes/Dash) -->
  <path d="M48,68 L54,74 L51,77 L56,83 L46,77 L49,74 Z" fill="#00ffcc" opacity="0.9"/>
</svg>