<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VJ Viewer | Pon Dash VJ Helper (β)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/png" href="/pon_dash/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/pon_dash/favicon.svg" />
    <link rel="shortcut icon" href="/pon_dash/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pon_dash/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pon Dash VJ Helper (β)" />
    <link rel="manifest" href="/pon_dash/site.webmanifest" />
</head>
<body class="app-page">
    <!-- ログイン画面 -->
    <div class="login-screen" id="loginScreen">
        <div class="glass-panel" style="max-width: 400px; width: 100%;">
            <h2>VJ Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>閲覧許可パスワード</label>
                    <input type="password" id="password" pattern="\d{4}" placeholder="数字4桁" required>
                </div>
                <button type="submit" class="btn btn-primary">ログイン</button>
                <div id="loginError" style="color: var(--danger-color); margin-top: 10px; display: none;">パスワードが違います</div>
            </form>
        </div>
    </div>

    <div class="container hidden" id="mainApp">
        <header style="margin-bottom: 2px; padding: 2px 0;">
            <h1 style="font-size: 1.2rem; margin: 0; line-height: 1;">PDVH (β) - VJ Viewer</h1>
            <p style="text-align: center; font-size: 0.8rem; margin: 2px 0 0 0;" id="sessionNameDisplay"></p>
        </header>

        <!-- 上段：ステータス表示 -->
        <div class="glass-panel" style="flex: 0 0 auto; padding: 5px;">
            <div style="display: flex; flex-direction: column; gap: 4px;">
                <!-- 入れ替え：DJからSENDされた曲を上に -->
                <div class="track-info-box send-track" id="sendTrackBox" style="margin-bottom: 0; padding: 4px 8px;">
                    <div class="label" style="margin-bottom: 2px; font-size:0.75rem;">DJからSENDされた曲 (Next from DJ)</div>
                    <div class="track-title" id="sendTitle">-</div>
                    <div class="track-artist" id="sendArtist">-</div>
                </div>

                <!-- 入れ替え：プレイリスト上の次の曲を下に -->
                <div class="track-info-box" style="margin-bottom: 0; padding: 4px 8px;">
                    <div class="label" style="margin-bottom: 2px; font-size:0.75rem;">プレイリスト上の次の曲 (Next in Playlist)</div>
                    <div class="track-title" id="nextTitle">-</div>
                    <div class="track-artist" id="nextArtist">-</div>
                </div>
            </div>
        </div>

        <!-- 中段：READYボタンと検索エリア（縦積み） -->
        <div style="display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto;">
            <!-- READYボタン (フルワイド) -->
            <div class="glass-panel" style="padding: 4px; text-align: center;">
                <button class="btn btn-ready" style="height: 50px; font-size: 1.5rem; padding: 2px;" id="readyBtn">READY</button>
                <p style="margin-top: 2px; font-size: 0.75rem; margin-bottom: 0;">※準備完了をDJに伝えます</p>
            </div>

            <!-- 検索リンク (テキストボックス＋5ボタン) -->
            <div class="glass-panel" style="padding: 5px 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px;">
                    <h3 style="font-size: 0.9rem; margin: 0;">素材検索</h3>
                </div>
                <div style="display: flex; gap: 8px; margin-bottom: 5px;">
                    <input type="text" id="vjSearchInput" placeholder="検索ワードを入力してください" style="flex: 1; padding: 8px; font-size: 0.9rem;">
                </div>
                <div class="search-links" id="searchLinksSend" style="display: flex; flex-wrap: wrap; gap: 4px;">
                    <!-- JSでイベントリスナー付きのボタンとして処理 -->
                    <button class="btn" style="flex: 1 1 18%; padding: 6px 2px; font-size: 0.75rem;" data-search="google">Google</button>
                    <button class="btn" style="flex: 1 1 18%; padding: 6px 2px; font-size: 0.75rem;" data-search="google_image">Google画像</button>
                    <button class="btn" style="flex: 1 1 18%; padding: 6px 2px; font-size: 0.75rem;" data-search="youtube">YouTube</button>
                    <button class="btn" style="flex: 1 1 18%; padding: 6px 2px; font-size: 0.75rem;" data-search="niconico">ニコニコ</button>
                    <button class="btn" style="flex: 1 1 18%; padding: 6px 2px; font-size: 0.75rem;" data-search="giphy">GIPHY</button>
                </div>
            </div>
        </div>

        <!-- 下段：プレイリスト -->
        <div class="glass-panel" style="display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; margin-top: 5px;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex: 0 0 auto; margin-bottom: 5px;">
                <h3 style="font-size: 0.9rem; margin: 0;">プレイリスト (DJ全体像)</h3>
            </div>
            <div class="playlist-container" id="playlistContainer" style="flex: 1; overflow-y: auto;">
                <!-- JSで動的に追加 -->
            </div>
        </div>
    </div>

    <!-- Pusherライブラリ (M-4: 本番デプロイ時に integrity 属性を追加してください) -->
    <!-- SRIハッシュ生成: openssl dgst -sha384 -binary pusher.min.js | openssl base64 -A -->
    <script src="https://js.pusher.com/8.2.0/pusher.min.js" crossorigin="anonymous"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/vj.js"></script>
</body>
</html>
